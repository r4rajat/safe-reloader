# This rule is not used by the project safe-reloader itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the config.safereloader.r4rajat.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: safe-reloader
    app.kubernetes.io/managed-by: kustomize
  name: safereloadpolicy-editor-role
rules:
- apiGroups:
  - config.safereloader.r4rajat.com
  resources:
  - safereloadpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - config.safereloader.r4rajat.com
  resources:
  - safereloadpolicies/status
  verbs:
  - get
